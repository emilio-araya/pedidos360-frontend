name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Resumen de pruebas y cobertura
        run: |
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path

          p = Path('coverage/coverage-summary.json')
          if p.exists():
              total = json.loads(p.read_text()).get('total', {})
          else:
              total = {}

          def valor(metric, key):
              return total.get(metric, {}).get(key, 'n/d')

          filas = [
              ('Sentencias', valor('statements', 'pct'), 60),
              ('Ramas', valor('branches', 'pct'), 45),
              ('Funciones', valor('functions', 'pct'), 60),
              ('Lineas', valor('lines', 'pct'), 65),
          ]
          lineas_ok = all(
              v == 'n/d' or float(v) >= umbral for _, v, umbral in filas
          )

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('### Resumen de pruebas\n\n')
              fh.write('| Metrica | Cobertura | Umbral |\n|---|---|---|\n')
              for nombre, valor_pct, umbral in filas:
                  fh.write(f'| {nombre} | {valor_pct}% | {umbral}% |\n')
          for nombre, valor_pct, umbral in filas:
              print(f'{nombre}: {valor_pct}% (umbral {umbral}%)')
          assert lineas_ok, 'la cobertura quedo bajo el umbral'
          PYEOF
      - name: Adjuntar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 30
      - name: Build
        run: npm run build
      - name: Build container
        run: >-
          docker build
          --build-arg ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000001
          --build-arg ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000002
          --build-arg API_SCOPE=api://00000000-0000-0000-0000-000000000003/access_as_user
          --build-arg API_BASE_URL=http://localhost:8080
          --build-arg REDIRECT_URI=http://localhost:4200/login
          --build-arg POST_LOGOUT_REDIRECT_URI=http://localhost:4200/login
          --build-arg COGNITO_USER_POOL_ID=us-east-1_example
          --build-arg COGNITO_USER_POOL_CLIENT_ID=exampleclientid
          --build-arg COGNITO_DOMAIN=example.auth.us-east-1.amazoncognito.com
          --build-arg COGNITO_ISSUER=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_example
          --build-arg COGNITO_REDIRECT_URI=http://localhost:4200/auth/cognito/callback
          --build-arg COGNITO_LOGOUT_URI=http://localhost:4200/login
          --build-arg 'COGNITO_API_SCOPE=openid email profile'
          -t pedidos360-frontend:ci .
