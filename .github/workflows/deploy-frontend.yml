name: Deploy frontend to S3 and CloudFront

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pedidos360-frontend-static
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish static SPA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      API_SCOPE: ${{ vars.API_SCOPE }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      REDIRECT_URI: ${{ vars.ENTRA_REDIRECT_URI }}
      POST_LOGOUT_REDIRECT_URI: ${{ vars.ENTRA_POST_LOGOUT_REDIRECT_URI }}
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_USER_POOL_CLIENT_ID: ${{ vars.COGNITO_USER_POOL_CLIENT_ID }}
      COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
      COGNITO_ISSUER: ${{ vars.COGNITO_ISSUER }}
      COGNITO_REDIRECT_URI: ${{ vars.COGNITO_REDIRECT_URI }}
      COGNITO_LOGOUT_URI: ${{ vars.COGNITO_LOGOUT_URI }}
      COGNITO_API_SCOPE: ${{ vars.COGNITO_API_SCOPE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check public configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$FRONTEND_BUCKET"
          test -n "$DISTRIBUTION_ID"
          test -n "$ENTRA_TENANT_ID"
          test -n "$ENTRA_CLIENT_ID"
          test -n "$API_BASE_URL"
          test -n "$COGNITO_USER_POOL_CLIENT_ID"
          test -n "$COGNITO_REDIRECT_URI"
      - name: Configure AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate public environment
        run: node scripts/generate-environment.js
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish to S3
        run: |
          aws s3 sync dist/ "s3://${FRONTEND_BUCKET}" \
            --delete \
            --cache-control 'public,max-age=0,must-revalidate' \
            --exclude 'index.html' \
            --exclude 'assets/*'
          aws s3 sync dist/assets/ "s3://${FRONTEND_BUCKET}/assets/" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control 'no-cache'
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
